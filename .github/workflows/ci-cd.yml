name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy fastapi "uvicorn[standard]" pydantic python-multipart httpx pytest pytest-asyncio transformers

      - name: Debug environment
        run: |
          python --version
          pip list
          python -c "import sys; print(sys.path)"

      - name: Run fast suite
        run: |
          python -m pytest -v --tb=long || {
            echo "=== COLLECTION DEBUG ==="
            python -m pytest --collect-only -v
            exit 1
          }

  deploy-modal:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: pip install modal

      - name: Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SONAVE_API_TOKEN: ${{ secrets.SONAVE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: modal deploy modal_app.py

      - name: Verify deployed version matches repo
        run: |
          repo=$(python -c "import re; print(re.search(r'version=\"([^\"]+)\"', open('service/app.py').read()).group(1))")
          live=$(curl -sf https://derekgallardo01--sonave-detector-fastapi-app.modal.run/openapi.json | python -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
          echo "repo=$repo live=$live"
          test "$repo" = "$live"
