<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonave — Meet panel</title>
<link rel="icon" href="data:image/svg+xml;base64,__FAVICON__">
<style>
:root{--bg:#0b0d10;--panel:#101418;--line:#1b2128;--line2:#242c35;--ink:#e8eef2;--ink2:#9aa9b5;
--muted:#718695;--green:#2ee584;--green-dark:#0d9e56;--on-green:#06130b;--amber:#ffb224;--red:#ff4d5e;
--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.5;min-height:100vh}
.hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px}
.brand b{font-size:13px}
.brand small{display:block;font-size:9px;color:var(--muted)}
.banner{padding:12px 14px;border-bottom:1px solid var(--line)}
.verdict{font-size:19px;font-weight:800;letter-spacing:-.01em}
.note{font-size:10.5px;color:var(--ink2);margin-top:2px}
.list{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.spk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.spk.fake{border-color:rgba(255,77,94,.45)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pct{font-family:var(--mono);font-size:12px;font-weight:600;flex-shrink:0}
.track{height:4px;background:#161c22;border-radius:2px;margin-top:7px;overflow:hidden}
.fill{height:100%;border-radius:2px;transition:width .5s ease}
.ft{padding:10px 14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted)}
.ft a{color:var(--green);text-decoration:none;font-weight:600;font-size:11px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 20px;text-align:center}
.center p{color:var(--muted);font-size:12px;max-width:240px}
.btn{padding:9px 18px;border-radius:9px;background:var(--green);color:var(--on-green);font:700 12px var(--font);border:0;cursor:pointer}
.btn:hover{background:#4deda0}
.mark{width:26px;height:26px}
</style>
</head>
<body>
<div class="hd">
 <div class="brand">
  <svg class="mark" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.6" stroke="var(--green)" stroke-width="2.2"></circle><path d="M6.9 12h.9l.6-1.4.7 2.9.8-4.1.9 5.4.9-7.2.9 8.3.8-6.9.7 4.8.7-2.9.6 1.6.5-.5h1.2" stroke="var(--green)" stroke-width="1.15" stroke-linejoin="round" stroke-linecap="round"></path><circle cx="18.1" cy="5.9" r="2.6" fill="var(--bg)"></circle><circle cx="18.1" cy="5.9" r="1.8" fill="var(--green)"></circle></svg>
  <div><b>Sonave</b><small>VOICE AUTHENTICITY · THIS CALL</small></div>
 </div>
</div>

<div id="signin" class="center" style="display:none">
 <p>Sign in to see live authenticity verdicts for this meeting's speakers.</p>
 <button class="btn" onclick="popupLogin()">Sign in with Google</button>
</div>

<div id="live" style="display:none">
 <div class="banner"><span class="verdict" id="room">—</span><div class="note" id="roomNote">waiting for audio…</div></div>
 <div id="protect" style="display:none;padding:12px;border-bottom:1px solid var(--line)">
  <button class="btn" style="width:100%" onclick="protectMeeting()">Protect this meeting</button>
  <div id="protectStatus" style="font-size:10.5px;color:var(--muted);margin-top:7px;line-height:1.5">Deploys the Sonave bot into this call — it joins visibly and scores every speaker. Announce recording to participants.</div>
 </div>
 <div class="list" id="speakers"></div>
 <div class="ft"><span id="meta">sonave-xlsr-meet</span><a href="/console" target="_blank" rel="noopener">Open console ↗</a></div>
</div>

<script>
// Google Meet Add-ons SDK bootstrap (developers.google.com/workspace/meet/add-ons):
// createAddonSession() signals Meet that the add-on finished loading, then the
// side-panel client binds this iframe. Guarded so the page also works standalone.
(function(){
 var s=document.createElement('script');
 s.src='https://www.gstatic.com/meetjs/addons/1.1.0/meet.addons.js';
 s.onload=async function(){
  try{
   var project='__MEET_PROJECT__';
   if(!project||!window.meet||!meet.addon)return;
   var session=await meet.addon.createAddonSession({cloudProjectNumber:project});
   window._sideClient=await session.createSidePanelClient();
  }catch(e){/* standalone or Meet API change — panel still works via polling */}
 };
 s.onerror=function(){};
 document.head.appendChild(s);
})();

function vcolor(p){return p>=0.7?'var(--red)':p>=0.4?'var(--amber)':'var(--green)'}
function vname(p){return p>=0.7?'FAKE':p>=0.4?'SUSPECT':'REAL'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

// Session token handoff: cookies can't cross the CHIPS partition into this
// iframe, so the sign-in popup posts the signed session token back to us and
// we authenticate with a Bearer header. sessionStorage here is partitioned to
// this Meet context, which is exactly the scope we want.
var TOK=sessionStorage.getItem('sonave_tok')||'';
window.addEventListener('message',function(e){
 if(e.origin===location.origin&&e.data&&e.data.type==='sonave_auth'&&e.data.token){
  TOK=e.data.token;
  try{sessionStorage.setItem('sonave_tok',TOK)}catch(x){}
  boot();
 }
});

function popupLogin(){
 var w=window.open('/auth/login?ctx=popup','sonave_login','width=480,height=640');
 var t=setInterval(function(){ if(w&&w.closed){clearInterval(t);poll()} },800);
}

var ME=null;
function authHeaders(extra){
 var h=extra||{};
 if(TOK)h['Authorization']='Bearer '+TOK;
 return h;
}
function isMe(spk){
 if(!ME||!ME.name)return false;
 var a=String(spk).replace(/_/g,' ').toLowerCase(), b=ME.name.toLowerCase();
 return a===b||a.split(' ')[0]===b.split(' ')[0];
}

async function protectMeeting(){
 var st=document.getElementById('protectStatus');
 st.textContent='Deploying the bot…';
 try{
  var code='';
  try{
   if(window._sideClient&&window._sideClient.getMeetingInfo){
    var mi=await window._sideClient.getMeetingInfo();
    code=(mi&&(mi.meetingCode||mi.meetingId))||'';
   }
  }catch(e){}
  if(!code){st.textContent='Could not read the meeting code — deploy from the console instead.';return}
  var r=await fetch('/bot',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),
                            body:JSON.stringify({meeting_url:'https://meet.google.com/'+code})});
  var d=await r.json();
  if(r.status===402){st.textContent=d.detail||'Free hours used — add a card in the console.';return}
  st.textContent=d.ok?'✓ Bot joining — admit “Sonave” from the waiting room, then just talk.':(d.detail||d.error||'Deploy failed — try from the console.');
 }catch(e){st.textContent='Deploy failed — try from the console.'}
}

async function poll(){
 try{
  var r=await fetch('/api/quality',{headers:authHeaders()});
  if(r.status===401){
   if(TOK){TOK='';try{sessionStorage.removeItem('sonave_tok')}catch(x){}}
   show('signin');return
  }
  var d=await r.json();
  show('live');
  if(!ME){try{ME=await (await fetch('/api/me',{headers:authHeaders()})).json()}catch(e){ME={}}}
  var ks=Object.keys(d).filter(function(k){return k[0]!=='_'});
  var maxP=0, rows='';
  ks.forEach(function(k){
   var s=d[k], p=s.auth_p!=null?s.auth_p:0;
   if(p>maxP)maxP=p;
   var pct=Math.round(p*100), c=vcolor(p);
   var you=isMe(k)?' <span style="color:var(--muted);font-weight:500">· you</span>':'';
   rows+='<div class="spk'+(p>=0.7?' fake':'')+'"><div class="row"><span class="name">'+esc(k)+you+'</span>'+
    '<span class="pct" style="color:'+c+'">'+(s.auth_verdict?pct+'%':'—')+'</span></div>'+
    '<div class="track"><div class="fill" style="width:'+pct+'%;background:'+c+'"></div></div></div>';
  });
  var hasAudio=ks.length>0;
  document.getElementById('protect').style.display=hasAudio?'none':'block';
  document.getElementById('speakers').innerHTML=rows||'';
  document.getElementById('room').textContent=hasAudio?(maxP>0?vname(maxP):'—'):'—';
  document.getElementById('room').style.color=vcolor(maxP);
  document.getElementById('roomNote').textContent=hasAudio? (maxP>=0.7?'A speaker is scoring in the red band.':'All speakers within normal range.') :'No bot in this meeting yet.';
 }catch(e){}
}
function show(id){['signin','live'].forEach(function(x){document.getElementById(x).style.display=x===id?'block':'none'})}
function boot(){poll();setInterval(poll,2000)}
boot();
</script>
</body>
</html>
